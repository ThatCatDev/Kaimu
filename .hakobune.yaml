# Hakobune deployment config for Kaimu
# Deploy: kaimu2.floretos.com

build: true
compose_file: docker-compose.prod.yaml

secrets:
  required:
    - POSTGRES_PASSWORD

hooks:
  post_deploy:
    - service: backend
      run: ./main migrate up
      depends_on:
        postgres: healthy
      timeout: 120s
    - run: echo "Kaimu deployed to kaimu2.floretos.com"

  on_failure:
    - run: echo "Deploy failed for kaimu at commit $HAKOBUNE_COMMIT"
      continue_on_error: true

deploy:
  routes:
    - domain: kaimu2.floretos.com
      port: 4321
      service: frontend
      ssl: auto
    - domain: kaimu2.floretos.com
      path: /api
      port: 3000
      service: backend
      ssl: auto
